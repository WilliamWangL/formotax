name: Deploy

# Build the api and web images in CI, push them to GHCR, then roll the stack on
# the server. The server only pulls images (same model as the fincode project),
# so it needs neither Node nor the build toolchain.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_SSH_KEY        private key whose public half is in ~/.ssh/authorized_keys
#   PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET / PAYPAL_WEBHOOK_ID
#   JWT_ACCESS_SECRET / JWT_REFRESH_SECRET
#   MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD / ADMIN_PASSWORD
# Variables:
#   PAYPAL_MODE           live | sandbox (required; the job fails without it)
#   DEPLOY_HOST / DEPLOY_USER
#   PUBLIC_BASE_URL       optional, defaults to https://formotax.ecommica.com
#
# `deploy/render-env.sh` turns them into the server's .env at deploy time.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR image paths must be lowercase; the repository owner is not.
  IMAGE_PREFIX: ghcr.io/williamwangl/formotax
  # The stack always lives here on this host: storage/ is bind-mounted from it.
  DEPLOY_DIR: /opt/tax

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @tax/api prisma:generate

      # next-env.d.ts references .next/types/routes.d.ts, which only exists
      # after a build, so typecheck has to run behind it.
      - name: Build workspaces
        run: pnpm build

      - name: Typecheck every workspace
        run: pnpm -r typecheck

  build-api:
    name: Build & push api image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}

  build-web:
    name: Build & push web image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_BASE_URL || 'https://formotax.ecommica.com' }}
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_BASE_URL || 'https://formotax.ecommica.com' }}/api/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}

  deploy:
    name: Deploy to server
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    # Put the secrets on this environment to require manual approval.
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Require an explicit PayPal mode
        env:
          PAYPAL_MODE: ${{ vars.PAYPAL_MODE }}
        run: |
          case "$PAYPAL_MODE" in
            live | sandbox) ;;
            *)
              echo "Set the PAYPAL_MODE repository variable to 'live' or 'sandbox'." >&2
              exit 1
              ;;
          esac

      - name: Render .env from Actions secrets
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          WEB_PORT: ${{ vars.WEB_PORT }}
          API_PORT: ${{ vars.API_PORT }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
          MYSQL_USER: ${{ vars.MYSQL_USER }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          PAYPAL_MODE: ${{ vars.PAYPAL_MODE }}
          PAYPAL_BRAND_NAME: ${{ vars.PAYPAL_BRAND_NAME }}
          DOWNLOAD_PRICE_USD: ${{ vars.DOWNLOAD_PRICE_USD }}
          DOWNLOAD_ACCESS_HOURS: ${{ vars.DOWNLOAD_ACCESS_HOURS }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: bash deploy/render-env.sh --out .env.deploy </dev/null

      - name: Upload compose files and .env
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?set the DEPLOY_HOST variable}"
          : "${DEPLOY_USER:?set the DEPLOY_USER variable}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" >"$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          ssh_opts=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )

          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_DIR/deploy/nginx'"
          scp "${ssh_opts[@]}" docker-compose.prod.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/docker-compose.prod.yml"
          # Host nginx configs are shipped for reference; installing them needs
          # root on the host and stays a manual step (deploy/enable-tls.sh).
          scp -r "${ssh_opts[@]}" deploy/nginx/. \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/deploy/nginx/"
          scp "${ssh_opts[@]}" .env.deploy \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/.env"
          # scp applies the remote umask; tighten before anything reads it.
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 600 '$DEPLOY_DIR/.env'"

      - name: Roll the production stack
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" >"$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          ssh_opts=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )

          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$DEPLOY_DIR'

            # GITHUB_TOKEN is short-lived: log in just long enough to pull.
            echo '$GH_TOKEN' | docker login '$REGISTRY' -u '$GH_OWNER' --password-stdin

            # One-time migration: the pre-GHCR stack still runs from the source
            # tree (/root/workspace/tax) and holds the ports. Named volumes
            # survive, so the database is kept.
            docker compose -f /root/workspace/tax/docker-compose.yml down \
              --remove-orphans --timeout 20 >/dev/null 2>&1 || true

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans \
              --wait --wait-timeout 300
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
          "
