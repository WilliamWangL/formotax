# formotax.ecommica.com — bootstrap block used only to obtain the certificate.
# Install as /etc/nginx/conf.d/formotax.ecommica.com.conf, reload nginx, then:
#   certbot certonly --webroot -w /var/www/letsencrypt -d formotax.ecommica.com
# Replace the file with formotax.ecommica.com.conf once the certificate exists.

server {
    listen 80;
    server_name formotax.ecommica.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # Temporary plain-HTTP passthrough so the stack can be checked before TLS.
    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
