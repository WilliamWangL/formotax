# formotax.ecommica.com — FormoTax reverse proxy.
# Target: the docker compose stack's web/api containers published on
# 127.0.0.1:3004 (web) and 127.0.0.1:8083 (api).
#
# Rollout (certificate first):
#   1. Install the bootstrap file, then issue the certificate:
#        certbot certonly --webroot -w /var/www/letsencrypt \
#          -d formotax.ecommica.com
#   2. Install this file as /etc/nginx/conf.d/formotax.ecommica.com.conf,
#      run `nginx -t && nginx -s reload`.
# Renewals keep working through the ACME location on port 80 (webroot).

server {
    listen 80;
    server_name formotax.ecommica.com;

    # ACME HTTP-01 challenges for certbot webroot renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name formotax.ecommica.com;

    ssl_certificate /etc/letsencrypt/live/formotax.ecommica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formotax.ecommica.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/formotax.ecommica.com_access.log main;
    error_log /var/log/nginx/formotax.ecommica.com_error.log warn;

    # PDF templates are streamed from the API; JSON bodies are small.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Next.js hashed static assets are immutable: cache hard for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    location /templates/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /pdf.worker.min.mjs {
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js serves the AI-friendly JSON/Markdown endpoints under /api/ai/*
    # itself, so they must reach the web container before the /api/ rule.
    location ^~ /api/ai/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nest API keeps its /api/v1 prefix; the app already sets the global prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The app builds absolute URLs (canonical, PayPal return) from this scheme.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
