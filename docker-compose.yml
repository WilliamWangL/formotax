name: tax-form-generator

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tax_form}
      MYSQL_USER: ${MYSQL_USER:-tax}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tax_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - '${MYSQL_PORT:-3306}:3306'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - '${REDIS_PORT:-6379}:6379'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-tax}:${MYSQL_PASSWORD:-tax_password}@mysql:3306/${MYSQL_DATABASE:-tax_form}
      REDIS_URL: redis://redis:6379
      WEB_URL: ${PUBLIC_BASE_URL:-http://localhost}
      CORS_ORIGINS: ${PUBLIC_BASE_URL:-http://localhost}
      TEMPLATE_DIR: ../web/public/templates
      STORAGE_DIR: /app/storage
    volumes:
      # Persisted local storage for updated PDF templates (replaces object storage).
      - ./storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '4000'

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL:-http://localhost}
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL:-http://localhost}/api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL:-http://localhost}/api/v1
    depends_on:
      - api
    expose:
      - '3000'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      # - '443:443'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api

volumes:
  mysql-data:
  redis-data:
