worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 8m;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml text/markdown;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  upstream tax_web {
    server web:3000;
    keepalive 32;
  }

  upstream tax_api {
    server api:4000;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;

    # ACME challenges stay on HTTP; everything else should redirect in
    # production once TLS is configured.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Static assets can be cached aggressively; HTML must always revalidate.
    location /_next/static/ {
      proxy_pass http://tax_web;
      proxy_cache_valid 200 30d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /templates/ {
      proxy_pass http://tax_web;
      add_header Cache-Control "public, max-age=86400";
    }

    location /pdf.worker.min.mjs {
      proxy_pass http://tax_web;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js serves the AI-friendly JSON/Markdown endpoints under /api/ai/*,
    # so they must reach the web upstream before the generic /api/ rule below.
    location ^~ /api/ai/ {
      proxy_pass http://tax_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API keeps its /api/v1 prefix; the Nest app already sets the global prefix.
    location /api/ {
      proxy_pass http://tax_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location / {
      proxy_pass http://tax_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # TLS listener. Mount certificates at /etc/nginx/certs and switch the port
  # mapping in docker-compose.yml when going live.
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name formotax.ecommica.com;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_session_cache shared:SSL:10m;
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #   include /etc/nginx/conf.d/taxform-locations.conf;
  # }
}
